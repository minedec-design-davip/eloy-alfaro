<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        header{
            background:#1565C0;
            color:white;
            text-align:center;
            padding:30px;
        }

        nav{
            background:#0D47A1;
            padding:15px;
            text-align:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:15px;
            font-weight:bold;
        }

        .contenedor{
            width:90%;
            max-width:1000px;
            margin:auto;
            padding:30px;
        }

        .tarjeta{
            background:white;
            padding:25px;
            margin-top:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        button{
            background:#1565C0;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:6px;
            cursor:pointer;
            margin-top:15px;
        }

        button:hover{
            background:#0D47A1;
        }

        footer{
            margin-top:40px;
            background:#222;
            color:white;
            text-align:center;
            padding:20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Bienvenido</h1>
    <p>Mi primera página en GitHub Pages</p>
</header>

<nav>
    <a href="#">Inicio</a>
    <a href="#">Servicios</a>
    <a href="#">Contacto</a>
</nav>

<div class="contenedor">

    <div class="tarjeta">
        <h2>Acerca del sitio</h2>
        <p>
            Esta página está alojada gratuitamente en GitHub Pages.
        </p>

        <button onclick="saludar()">Haz clic</button>
    </div>

</div>

<footer>
    © 2026 Mi Sitio Web
</footer>

<script>
function saludar(){
    alert("¡Hola! Tu página funciona correctamente.");
}
</script>

</body>
</html>
